<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaVM - Virtual PC</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #090d18;
      color: #eef2ff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px 24px;
      background: #101729;
      border-bottom: 1px solid #293650;
    }

    header h1 { margin: 0; }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 24px;
    }

    .panel {
      padding: 20px;
      background: #111a2c;
      border: 1px solid #293650;
      border-radius: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0;
    }

    button {
      padding: 12px 18px;
      color: white;
      background: #233451;
      border: 1px solid #405273;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #30466b; }

    #start { background: #2563eb; }

    #status { color: #8de0bd; }

    #message { color: #b9c4da; }

    #vm {
      background: #000;
      border: 1px solid #34415b;
      border-radius: 8px;
      overflow: auto;
    }

    #screen_container {
      min-height: 300px;
      background: #000;
      overflow: auto;
    }

    #screen_container .screen {
      white-space: pre;
      font-family: monospace;
      line-height: 1;
    }

    #screen_container canvas {
      max-width: 100%;
    }

    #placeholder {
      min-height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #93a4c1;
    }

    #vm:fullscreen {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      overflow: auto;
      background: #000;
    }

    #vm:fullscreen #screen_container {
      flex: 1;
      min-height: 0;
    }

    .note {
      color: #8291ad;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      main { padding: 12px; }
      .panel { padding: 12px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>NovaVM</h1>
    <p>Browser-powered virtual PC</p>
  </header>

  <main>
    <section class="panel">
      <p id="status">Virtual PC stopped</p>
      <p id="message">Press Boot NovaVM to start KolibriOS.</p>

      <div class="controls">
        <button id="start" type="button">Boot NovaVM</button>
        <button id="fullscreenBtn" type="button">⛶ Fullscreen</button>
      </div>

      <div id="vm">
        <div id="placeholder">
          <div>
            <h2>NovaVM</h2>
            <p>Your virtual PC will appear here.</p>
          </div>
        </div>

        <div id="screen_container" hidden>
          <div class="screen"></div>
          <canvas style="display:none"></canvas>
        </div>
      </div>

      <p class="note">No software installation required.</p>
    </section>
  </main>

  <script src="./vm.js"></script>
</body>
</html>
