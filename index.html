
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NovaVM</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #080c16;
      color: #eef3ff;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(1000px, 100%);
      background: #101827;
      border: 1px solid #273650;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 80px #0008;
    }

    header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid #273650;
    }

    h1 { margin: 0; font-size: 24px; }
    .status { color: #aab8d0; font-size: 13px; }
    .content { padding: 24px; }

    .screen {
      min-height: 320px;
      padding: 20px;
      display: grid;
      place-items: center;
      text-align: center;
      background: #05080e;
      border: 1px solid #30415e;
      border-radius: 12px;
      overflow: auto;
    }

    #screen_container {
      width: 100%;
      color: #fff;
      text-align: left;
      overflow: auto;
    }

    #screen_container > div {
      white-space: pre;
      font: 14px monospace;
      line-height: 14px;
    }

    #screen_container canvas {
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 9px;
      background: #7c6cff;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }
    p { color: #aab8d0; line-height: 1.6; }
    .note { font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>✦ NovaVM</h1>
      <span class="status" id="status">VM offline</span>
    </header>

    <section class="content">
      <div class="screen">
        <div id="placeholder">
          <div style="font-size:48px">▣</div>
          <h2>Your virtual computer</h2>
          <p id="message">
            Start NovaVM to load the browser-based emulator.
          </p>
          <button id="start">Boot NovaVM</button>
          <p class="note">Browser-powered · No software installation</p>
        </div>
        <button id="fullscreenBtn" type="button">⛶ Fullscreen</button>
        <div id="screen_container" hidden>
          <div></div>
          <canvas style="display:none"></canvas>
        </div>
      </div>

      <p class="note">
        NovaVM runs a guest operating system using your browser's
        processing power. Initial boot may take some time.
      </p>
    </section>
  </main>

  <script src="vm.js"></script>
</body>
</html>
